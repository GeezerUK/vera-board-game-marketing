<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: 'Arial Black', 'Arial', sans-serif;
      }
      
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: #000;
      }

      .overlay-text {
        position: absolute;
        width: 100%;
        text-align: center;
        color: #FFFFFF;
        font-family: 'Arial Black', 'Arial', sans-serif;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1.1;
      }

      /* Hook text */
      #hook-line1 {
        top: 280px;
        font-size: 120px;
        text-shadow: 0 0 40px rgba(0,0,0,0.98), 0 8px 24px rgba(0,0,0,0.95), 0 4px 12px rgba(0,0,0,0.9);
      }
      #hook-line2 {
        top: 420px;
        font-size: 100px;
        color: #FFD700;
        text-shadow: 0 0 50px rgba(0,0,0,0.98), 0 8px 24px rgba(0,0,0,0.95), 0 4px 12px rgba(0,0,0,0.9);
      }

      /* Game name */
      #game-name {
        top: 620px;
        font-size: 160px;
        color: #FFFFFF;
        text-shadow: 0 0 60px rgba(0,0,0,0.99), 0 12px 32px rgba(0,0,0,0.95), 0 6px 16px rgba(0,0,0,0.9);
      }
      #tagline {
        top: 800px;
        font-size: 50px;
        color: #CCCCCC;
        font-weight: normal;
        text-shadow: 0 0 30px rgba(0,0,0,0.98), 0 6px 16px rgba(0,0,0,0.9);
      }

      #divider {
        position: absolute;
        top: 930px;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        height: 2px;
        background: rgba(255,255,255,0.3);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ticket-to-ride-overlay"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- Hook section -->
      <div id="hook-line1" class="overlay-text">ALL ABOARD</div>
      <div id="hook-line2" class="overlay-text">THE CLASSIC</div>

      <!-- Game info section -->
      <div id="game-name" class="overlay-text">TICKET TO RIDE</div>
      <div id="tagline" class="overlay-text" style="font-family:'Georgia', serif; font-style:italic; text-transform:none;">Build Your Route. Claim Your Railway.</div>
      <div id="divider"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.set("#hook-line1, #hook-line2, #game-name, #tagline, #divider", { opacity: 0 });
      
      // SCENE 1: Hook (0-5s)
      tl.fromTo("#hook-line1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.fromTo("#hook-line2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.2);
      tl.to("#hook-line1", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 4.5);
      tl.to("#hook-line2", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 4.5);
      
      // SCENE 2: Game info (5-15s)
      tl.fromTo("#game-name", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 5.5);
      tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.2);
      tl.fromTo("#divider", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 6.2);
      
      window.__timelines["ticket-to-ride-overlay"] = tl;
    </script>
  </body>
</html>
